<ng-container *ngIf="!isAuthRoute; else authOnly">
  <mat-sidenav-container
    class="shell"
    [class.shell--open]="isSidenavOpened"
    [style.--side-offset.px]="isSidenavOpened ? 300 : 0">

    <mat-sidenav
      #sidenav
      mode="side"
      [opened]="isSidenavOpened"
      (openedChange)="onSidenavChange($event)">

      <div class="side__header">
        <ng-container *ngIf="profilePhoto; else fallbackAvatar">
          <div class="side__avatar">
            <img [src]="profilePhoto" alt="Foto de perfil" />
          </div>
        </ng-container>
        <ng-template #fallbackAvatar>
          <div class="side__avatar side__avatar--fallback">
            <span>{{ initials }}</span>
          </div>
        </ng-template>
        <div class="who">
          <div class="name">{{ user.name }}</div>
          <div class="role">{{ user.roleLabel }}</div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <div class="side__section-title"></div>

      <mat-nav-list class="side__nav">
        <a mat-list-item
           *ngFor="let item of nav"
           [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="sidenav.mode === 'over' && sidenav.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      </mat-nav-list>

      <div class="side__footer">
        <span class="side__footer-text">Sistema de Prácticas</span>
        <span class="side__footer-version">v1.0</span>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <!-- TOPBAR -->
      <mat-toolbar class="topbar">
        
          <button mat-icon-button (click)="toggleSidenav(sidenav)">
            <mat-icon>menu</mat-icon>
          </button>

          <button mat-icon-button (click)="goHome()">
            <mat-icon>home</mat-icon>
          </button>

          <span class="spacer"></span>

          <button mat-stroked-button color="accent" (click)="logout()">
            <mat-icon>logout</mat-icon>
            Cerrar sesión
          </button>
        
      </mat-toolbar>

      <main class="page">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-template #authOnly>
  <router-outlet></router-outlet>
</ng-template>
