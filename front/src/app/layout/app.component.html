<!-- LAYOUT COMPLETO (todas las rutas excepto login / recuperar-clave) -->
<ng-container *ngIf="!isAuthRoute; else authOnly">
  <mat-sidenav-container class="shell">

    <!-- SIDEBAR -->
    <mat-sidenav
      #sidenav
      class="side"
      mode="side"
      [opened]="isSidenavOpened"
      (openedChange)="onSidenavChange($event)">

      <!-- Header usuario -->
      <div class="side__header">
        <ng-container *ngIf="profilePhoto; else fallbackAvatar">
          <div class="side__avatar">
            <img [src]="profilePhoto" alt="Foto de perfil" />
          </div>
        </ng-container>

        <ng-template #fallbackAvatar>
          <div class="side__avatar side__avatar--fallback">
            <span>{{ initials }}</span>
          </div>
        </ng-template>

        <div class="who" *ngIf="user as u; else userSkeleton">
          <div class="name">{{ u.name }}</div>
          <div class="role">{{ u.roleLabel }}</div>
        </div>

        <ng-template #userSkeleton>
          <div class="who">
            <div class="name">Usuario</div>
            <div class="role">&nbsp;</div>
          </div>
        </ng-template>

      </div>

      <mat-divider></mat-divider>

      <!-- Navegación -->
      <mat-nav-list class="side__nav">

        <!-- Links base (Mi cuenta / nav normal) -->
        <a
          mat-list-item
          *ngFor="let item of nav"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="sidenav.mode === 'over' && sidenav.close()">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>

        <!-- Secciones SOLO Jefatura (estilo portal/accordion) -->
        <ng-container *ngIf="isJefatura">

          <div class="nav-section" *ngFor="let section of navSections">

            <!-- Header del módulo -->
            <button
              type="button"
              class="nav-section__header"
              (click)="toggleSection(section.id)">

              <span class="nav-section__left">
                <mat-icon class="nav-section__icon">{{ section.icon }}</mat-icon>
                <span class="nav-section__title">{{ section.title }}</span>
              </span>

              <mat-icon
                class="nav-section__chev"
                [class.is-open]="openSections[section.id]">
                chevron_right
              </mat-icon>
            </button>

            <!-- Items del módulo -->
            <div class="nav-section__items" *ngIf="openSections[section.id]">
              <a
                mat-list-item
                class="nav-item nav-item--child"
                *ngFor="let item of section.items"
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                (click)="sidenav.mode === 'over' && sidenav.close()">

                <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                <span matListItemTitle>{{ item.label }}</span>
              </a>
            </div>

          </div>
        </ng-container>

      </mat-nav-list>

      <!-- Pie del sidebar -->
      <div class="side__footer">
        <span class="side__footer-text">Sistema de gestión académica</span>
        <span class="side__footer-version">v1.0 PEDHG</span>
      </div>
    </mat-sidenav>

    <!-- CONTENIDO -->
    <mat-sidenav-content class="content">
      <!-- TOPBAR -->
      <mat-toolbar class="topbar" color="primary">
        <button mat-icon-button class="menu-btn" (click)="toggleSidenav(sidenav)">
          <mat-icon>menu</mat-icon>
        </button>

        <button
          mat-icon-button
          class="home-btn"
          aria-label="Volver al dashboard"
          (click)="goHome()">
          <mat-icon>home</mat-icon>
        </button>

        <span class="spacer"></span>

        <button
          mat-stroked-button
          color="accent"
          class="logout-btn"
          (click)="logout()">
          <mat-icon>logout</mat-icon>
          Cerrar sesión
        </button>
      </mat-toolbar>

      <!-- CONTENIDO DE PÁGINA -->
      <main class="page">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<!-- SOLO VISTAS DE AUTENTICACIÓN (login, recuperar clave, etc.) -->
<ng-template #authOnly>
  <router-outlet></router-outlet>
</ng-template>
