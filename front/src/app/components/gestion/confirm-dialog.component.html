<div class="cd">
  <div class="cd__icon" [class.cd__icon--danger]="isDanger">
    <mat-icon>{{ isDanger ? 'warning_amber' : 'help_outline' }}</mat-icon>
  </div>

  <div class="cd__content">
    <h2 class="cd__title">{{ data.title || 'Confirmar acción' }}</h2>

    <p class="cd__message" *ngIf="data.message">{{ data.message }}</p>

    <div class="cd__detail" *ngIf="data.detail">
      <mat-icon class="cd__detailIcon">event</mat-icon>
      <span class="cd__detailText">{{ data.detail }}</span>
    </div>

    <p class="cd__hint" *ngIf="isDanger">Esta acción no se puede deshacer.</p>
  </div>
</div>

<div class="cd__actions">
  <button mat-stroked-button type="button" (click)="cancelar()">
    {{ data.cancelText || 'Cancelar' }}
  </button>

  <button
    mat-flat-button
    [color]="isDanger ? 'warn' : 'primary'"
    type="button"
    (click)="confirmar()"
  >
    <mat-icon>{{ isDanger ? 'delete' : 'check' }}</mat-icon>
    {{ data.confirmText || (isDanger ? 'Eliminar' : 'Confirmar') }}
  </button>
</div>
